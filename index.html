<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Магический Шар</title>
<meta name="theme-color" content="#ece2cd">
<style>
:root{--paper:#ece2cd;--paper-d:#ddd0b2;--ink:#26201a;--ink-soft:#5a4a38;--seal:#8b2019;--gold:#9c7a2c;--frame:#3a2c1c;--card:rgba(58,44,28,.05)}
body.dark{--paper:#1a1714;--paper-d:#24201a;--ink:#e8dfd0;--ink-soft:#a89880;--seal:#d4513f;--gold:#d4a94c;--frame:#4a3a28;--card:rgba(232,223,208,.05)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;font-family:Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;color:var(--ink);background:var(--paper);transition:background .3s,color .3s;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 50% 40% at 20% 15%,rgba(180,140,80,.15),transparent 70%),radial-gradient(ellipse 55% 45% at 80% 85%,rgba(140,100,50,.12),transparent 70%)}
body.dark::before{opacity:.3}
.frame{position:fixed;inset:12px;border:1px solid var(--frame);opacity:.4;pointer-events:none;z-index:5}
.frame::before{content:'';position:absolute;inset:4px;border:1px solid var(--frame);opacity:.5}
.container{position:relative;z-index:10;width:100%;max-width:600px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:20px}
h1{font-size:clamp(36px,8vw,64px);font-weight:700;letter-spacing:.14em;margin-bottom:10px;text-shadow:3px 3px 0 rgba(139,32,25,.15);cursor:pointer;transition:transform .2s}
h1:active{transform:scale(.95)}
.subtitle{font-family:'Courier New',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
.instruction{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:15px;line-height:1.5;text-transform:uppercase;letter-spacing:.05em}
.input-group{display:flex;flex-direction:column;gap:12px;width:100%}
input[type="text"]{width:100%;padding:16px;font-family:Georgia,serif;font-size:18px;color:var(--ink);background:var(--paper-d);border:1px solid var(--frame);box-shadow:inset 2px 2px 0 rgba(58,44,28,.1);outline:none;transition:all .2s}
input[type="text"]:focus{background:var(--paper);box-shadow:inset 2px 2px 0 rgba(58,44,28,.2), 0 0 0 3px rgba(139,32,25,.1)}
input[type="text"]::placeholder{color:var(--ink-soft);opacity:.6;font-style:italic}
.btn{display:inline-block;padding:16px 40px;font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:var(--paper);background:var(--ink);border:1px solid var(--frame);cursor:pointer;letter-spacing:.16em;text-transform:uppercase;box-shadow:3px 3px 0 rgba(58,44,28,.35);transition:all .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(58,44,28,.35)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(58,44,28,.35)}
.btn.btn-seal{background:var(--seal);color:var(--paper)}
.answer-box{background:var(--card);border:1px solid var(--frame);padding:30px 20px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:4px 4px 0 rgba(58,44,28,.15);margin-top:10px;opacity:0;transform:translateY(10px);transition:all .4s cubic-bezier(.2,.9,.4,1)}
.answer-box.show{opacity:1;transform:translateY(0)}
.answer-box::after{content:'';position:absolute;inset:4px;border:1px solid var(--frame);pointer-events:none;opacity:.2}
.answer-text{font-size:clamp(20px,4vw,28px);font-weight:700;color:var(--seal);line-height:1.3;text-align:center}
.controls{position:fixed;top:20px;right:20px;z-index:100}
.settings-btn{padding:8px 14px;background:var(--paper);border:1px solid var(--frame);font-family:'Courier New',monospace;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;color:var(--ink);box-shadow:2px 2px 0 rgba(58,44,28,.2)}
.settings-btn:hover{background:var(--paper-d)}
.shake{animation:shakeAnim .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shakeAnim{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-4px,0,0)}40%,60%{transform:translate3d(4px,0,0)}}
.question-display{font-family:'Courier New',monospace;font-size:14px;color:var(--ink-soft);margin-bottom:15px;font-style:italic;text-align:center;padding:0 10px}
</style>
</head>
<body>

<div class="frame"></div>

<div class="controls">
    <button class="settings-btn" id="theme-toggle">Тема</button>
</div>

<div class="container">
    <h1 id="title">МАГИЧЕСКИЙ ШАР</h1>
    <div class="subtitle">Задай вопрос вселенной</div>
    
    <div class="instruction">
        Введи свой вопрос в поле ниже и нажми кнопку.<br>Шар даст случайный ответ.
    </div>
    
    <div class="input-group">
        <input type="text" id="question" placeholder="Ваш вопрос..." autocomplete="off">
        <button class="btn btn-seal" id="ask-btn">Спросить</button>
    </div>

    <div class="answer-box" id="answer-box">
        <div id="question-display" class="question-display"></div>
        <div class="answer-text" id="answer-text"></div>
    </div>
</div>

<script>
const answers = [
    "Бесспорно",
    "Предрешено",
    "Никаких сомнений",
    "Определённо да",
    "Можешь быть уверен в этом",
    "Мне кажется - да",
    "Пока неясно, попробуй снова",
    "Спроси позже",
    "Лучше не рассказывать",
    "Сейчас нельзя предсказать",
    "Даже не думай",
    "Мой ответ - нет",
    "По моим данным - нет",
    "Весьма сомнительно"
];

const inputEl = document.getElementById('question');
const btnEl = document.getElementById('ask-btn');
const boxEl = document.getElementById('answer-box');
const textEl = document.getElementById('answer-text');
const qDisplayEl = document.getElementById('question-display');
const titleEl = document.getElementById('title');
const themeBtn = document.getElementById('theme-toggle');

function askMagicBall() {
    let q = inputEl.value.trim();
    
    if (!q) {
        boxEl.classList.add('shake');
        setTimeout(() => boxEl.classList.remove('shake'), 500);
        return;
    }

    if (!q.endsWith('?')) {
        q += '?';
    }

    boxEl.classList.remove('show');
    boxEl.classList.add('shake');

    setTimeout(() => {
        boxEl.classList.remove('shake');
        
        const randomIndex = Math.floor(Math.random() * answers.length);
        const answer = answers[randomIndex];

        qDisplayEl.textContent = q;
        textEl.textContent = answer;
        
        boxEl.classList.add('show');
        inputEl.value = '';
    }, 500);
}

btnEl.addEventListener('click', askMagicBall);

inputEl.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        askMagicBall();
    }
});

themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    themeBtn.textContent = isDark ? 'Светлая' : 'Темная';
});

let clickCount = 0;
titleEl.addEventListener('click', () => {
    clickCount++;
    if (clickCount >= 5) {
        titleEl.style.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
        clickCount = 0;
    }
});
</script>
</body>
</html>
